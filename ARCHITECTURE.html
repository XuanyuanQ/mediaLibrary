# Media Library 架构设计（MVVM）

> 适用范围：Qt 6 / QML 媒体库浏览器（新版）
> 界面设计稿：[`../design/media_library_ui.html`](../design/media_library_ui.html)
> 架构模式：**MVVM**（Model – ViewModel – View），C++ 负责 Model 和 ViewModel，QML 只做 View

---

## 1. 功能范围

| 类别 | 功能 | 说明 |
|---|---|---|
| 题目必做 | 媒体列表 | 每行显示标题和创作者（另有类型图标、年份） |
| 题目必做 | 搜索 | 按标题或创作者搜索，不区分大小写，支持多个关键字 |
| 题目必做 | 详情 | 选中条目后显示完整信息 |
| 题目必做 | 无结果提示 | 显示一行文字说明没有匹配结果（不加按钮） |
| 题目必做 | 技术要求 | 界面用 QML，数据模型用 C++ |
| 加分项 | 类型筛选 | 下拉框：All / Movies / Music / Books / Podcasts / Others |
| 加分项 | 语言切换 | 英文、瑞典语**运行时**切换，不需要重启 |
| 加分项 | 布局 | 只做横屏（车机、桌面）：左列表 + 右详情 |

**刻意不做**：播放、收藏和文件夹、数据持久化、在线数据源、单元测试（题目未要求）。这些写在 README 的“后续改进”部分。

---

## 2. 为什么选 MVVM

QML 的**属性绑定**天然对应 MVVM：View 绑定 ViewModel 的属性，属性一变界面自动刷新（下发）；用户操作统一通过 `UiEvents.post(类型, 数据)` 上发，按模块分发给各自的处理函数（上发），见第 4.1 节。

| 层 | 职责 | 依赖方向 |
|---|---|---|
| **View**（QML） | 只负责“怎么显示”：布局、样式、动画；把点击、输入转成对 ViewModel 的调用 | 依赖 ViewModel |
| **ViewModel**（C++） | 界面状态和界面逻辑：搜索词、筛选、选中项、空状态、显示用的格式化文本 | 依赖 Model 和 Service，**不知道 QML 的存在** |
| **Model**（C++） | 数据本身：从哪来、长什么样 | 不依赖任何上层 |
| **Service**（C++） | 和界面无关的应用级能力：语言切换 | 不依赖上层 |

**带来的好处**
- 界面逻辑都在 C++ 里，不依赖 QML，**以后补单元测试时不需要启动界面**。
- View 很“薄”，换界面风格只改 QML，逻辑不用动。

## 4. 对象由谁创建：`main.cpp` 创建，注册成 QML 单例

所有 C++ 对象都在 `main.cpp` 里创建并连接好，再注册成 **QML 单例**交给界面。**QML 不自己 new 任何业务对象**，任何 QML 文件 `import MediaLibrary.Core` 后直接按名字使用，不需要逐层传递。

```mermaid
flowchart LR
    A["MediaJsonLoader"] -->|"load(:/data/media.json)"| B["MediaLibraryModel"]
    B -->|构造参数| C["LibraryManager"]
    D["LanguageManager"] -->|"languageChanged 信号"| C
    U["UiEvents"] -->|"post → handleUiEvent"| C
    U -->|"post → handleUiEvent"| D
    C -->|"data()"| LD["LibraryData"]
    D -->|"data()"| GD["LanguageData"]
    LD -->|"注册为单例 LibraryData"| E["任意 QML 文件"]
    GD -->|"注册为单例 LanguageData"| E
    U -->|"注册为单例 UiEvents"| E
```

```cpp
// main.cpp（示意）
MediaLibraryModel library;
library.setItems(MediaJsonLoader::load(":/data/media.json").items);   // 加载数据

LibraryManager libraryManager(&library);
LanguageManager language;
QObject::connect(&language, &LanguageManager::languageChanged,
                 &libraryManager, &LibraryManager::retranslate);    // 语言变了，刷新格式化文本

UiEvents uiEvents;                       // 上发：每个模块 connect 一次，各自只处理本模块的消息
QObject::connect(&uiEvents, &UiEvents::post, &libraryManager, &LibraryManager::handleUiEvent);  // 100~199
QObject::connect(&uiEvents, &UiEvents::post, &language,  &LanguageManager::handleUiEvent);   // 200~299

// QML 只能看到三个接口对象；逻辑类 LibraryManager、LanguageManager 不注册
qmlRegisterSingletonInstance("MediaLibrary.Core", 1, 0, "UiEvents", &uiEvents);            // 上发
qmlRegisterSingletonInstance("MediaLibrary.Core", 1, 0, "LibraryData", libraryManager.data());  // 下发
qmlRegisterSingletonInstance("MediaLibrary.Core", 1, 0, "LanguageData", language.data());  // 下发

QQmlApplicationEngine engine;     // 最后创建、最先销毁，保证 QML 销毁时 C++ 对象还在
language.setEngine(&engine);
engine.loadFromModule("MediaLibrary", "Main");
```

```qml
// 任意 QML 文件
import MediaLibrary.Core

TextField {
    text: LibraryData.toUiSearchText                   // 下发：读属性
    onTextEdited: UiEvents.post(FromUi.SearchEdited, text)      // 上发：发消息
}
Button    { onClicked: UiEvents.post(FromUi.LanguageSelected, "sv") }
```

- **单例写法**：`main.cpp` 创建对象后，用 `qmlRegisterSingletonInstance` 把它注册成单例。注册的是三个接口对象（`UiEvents`、`LibraryData`、`LanguageData`），逻辑类不注册；对象仍归 C++ 所有，QML 引擎不会删除它，所以引擎要最后创建、最先销毁。这种注册发生在运行时，代价是 Qt Creator 的补全和 qmllint 认不出这两个单例，但不影响编译和运行。不使用已不推荐的 `setContextProperty`。
- **为什么选单例而不是逐层传属性**：应用只有一个页面级 ViewModel，单例最简单，不需要每层组件都声明属性再往下传。以后如果同一个组件要服务多个实例（比如分屏显示两个媒体库），只需在那个组件上加一个属性参数。
- ViewModel 和 LanguageManager 之间不直接引用，由 `main.cpp` 用信号槽连起来，两边都保持独立。

### 4.1 上发和下发

界面和 C++ 之间只有两个方向，各有一个统一的接口：

| 方向 | 接口 | QML 写法 | 规则 |
|---|---|---|---|
| **上发**（QML → C++） | `UiEvents` 消息总线：一个信号 `post(类型, 数据)` | `UiEvents.post(FromUi.ItemClicked, mediaId)` | QML 只报告“发生了什么”，不直接调用逻辑；消息按模块分段，各模块的 `handleUiEvent()` 只处理自己那一段 |
| **下发**（C++ → QML） | 纯数据类 `LibraryData`、`LanguageData` 的只读属性 | `text: LibraryData.toUiSearchText` | 逻辑类算完后调用统一入口 `m_data.publish(ToUi::名字, 值)`；名字在 `src/interface/ToUi.h` 集中登记；值变了才发 NOTIFY，QML 绑定自动刷新 |

**命名规则：从名字就能看出方向**

| 方向 | 消息名 | QML 写法 |
|---|---|---|
| 上发（UI 发出） | `FromUi::ItemClicked` | `UiEvents.post(FromUi.ItemClicked, id)` |
| 下发（发往 UI） | `ToUi::SelectedItem` | `LibraryData.toUiSelectedItem`（属性名统一带 `toUi` 前缀） |

上发消息表（定义在 `src/interface/FromUi.h` 的枚举里）：

| 模块（编号段） | 消息 | data 类型 | 谁发出 | 处理 |
|---|---|---|---|---|
| 媒体库（100~199） | `SearchEdited` | `QString` | `SearchField`（输入、✕） | `LibraryManager::handleUiEvent` → `setSearchText` |
| | `TypeSelected` | `QString`（类型 key） | `TypeFilter` | → `setCategory` |
| | `ItemClicked` | `int`（媒体 ID） | `MediaRow` | → `select` |
| 语言（200~299） | `LanguageSelected` | `QString`（语言代码） | `LanguageSwitch` | `LanguageManager::handleUiEvent` → `setLanguage` |

- **按模块分发**：`main.cpp` 里每个模块 connect 一次，所有模块都收到每条消息，用 `FromUi::moduleOf(类型)` 过滤掉不属于自己的。connect 的数量等于模块数，不等于消息数；加新消息只改枚举和对应模块的 `handleUiEvent()`，`main.cpp` 不用动。
- **统一入口**：所有界面操作都经过 `post()` 这一个信号，以后加日志、转发到其他进程、录制回放，都只改这一个地方。
- **类型检查**：数据用 `QVariant` 传，没有编译期检查，所以 `handleUiEvent()` 先检查类型，不对就打警告并丢弃，例如 `FromUi::ItemClicked expects a media id, got QVariant(QString, "abc")`。
- 逻辑类（`LibraryManager`、`LanguageManager`）不注册到 QML；数据类的属性没有 `WRITE`，所以 QML **只能**通过 `UiEvents` 上发、只能读数据类，这条规则由 Qt 保证，不靠约定。

**下发：一个消息表 + 一个统一入口 `publish()`**（参考车机 cluster 项目的 `setProperty` + `DATA_PROPERTY_DEFINE`）

和上发完全对称：

| | 名字集中定义在 | 统一入口 |
|---|---|---|
| 上发 | `src/interface/FromUi.h` 的 `FromUi::Message` | `UiEvents.post(FromUi::ItemClicked, id)` |
| 下发 | `src/interface/ToUi.h` 的 `ToUi::Message` | `m_data.publish(ToUi::SelectedItem, detail)` |

```cpp
// 1. ToUi.h：所有下发数据的名字，按模块分段（媒体库 100~199，语言 200~299）
enum Key { SearchText = 100, Category, Categories, ResultCount, ..., Language = 200, ... };

// 2. LibraryData.toUiH：只有数据，没有逻辑。一行定义一个属性，名字只写一次，必须和 ToUi.h 里的一样；QML 属性名自动加 toUi 前缀
UI_PROPERTY(int, ResultCount)
// 宏展开后 = Q_PROPERTY(int toUiResultCount READ getResultCount NOTIFY toUiResultCountChanged)（QML 只读）
//          + getResultCount() + toUiResultCountChanged() + 私有的 setResultCount() + 存储
//          + 对象创建时把 “ToUi::ResultCount → setResultCount” 登记到 UiDataBase 的表里

// 3. LibraryManager.cpp：逻辑算完后通过统一入口下发
void LibraryManager::publishCounts() {
    m_data.publish(ToUi::ResultCount, m_filter->rowCount());
    m_data.publish(ToUi::TotalCount, m_library->getCount());
    m_data.publish(ToUi::EmptyState, QVariant::fromValue(computeEmptyState()));
}
```

- **名字集中登记，没登记就编译报错**：`publish(ToUi::Foo, …)` 或 `UI_PROPERTY(int, Foo)` 里的 `Foo` 不在 `ToUi.h` 里，编译就失败。
- **`publish()` 查表调用 setter，不用 `QObject::setProperty`**：`setProperty` 要求属性带 `WRITE`，带了之后 QML 也能写，“QML 只读”就保证不了；而且名字写错时它会悄悄新建一个动态属性，不报错。
- **运行时检查**：值的类型不对（`ToUi::ResultCount expects int, got QVariant(QString, "abc")`）或者发错了数据类（`LibraryData has no property for ToUi::Language`），都会打警告并丢弃。
- **统一的下发日志**：运行前设置 `QT_LOGGING_RULES="ui.data.debug=true"`，每一次下发都会打印出来，例如 `ui.data: ToUi::ResultCount QVariant(int, 2)`。
- **下发点看得见**：在逻辑类里搜索 `publish(` 就能列出全部下发点。
- **唯一的例外是列表 `items`**：它是 `QAbstractItemModel`，靠 `rowsRemoved` / `rowsInserted` 增量更新，不能整体替换，所以只在启动时交给 `LibraryData` 一次（`CONSTANT`）。
- 纯视觉的交互（展开下拉框、悬停高亮、输入框获得焦点）不上发，留在 QML 里。
- Qt 官方示例一般让 QML 直接调用 ViewModel；这里参考车机 HMI 常见的消息分发方式（类似 Kanzi 的 message type），让所有界面消息走统一入口、按模块分类，方便以后扩展到更多模块。

## 5. C++ 模块

### 5.1 类图

### 5.2 职责说明

| 类 | 层 | 职责 | 关键点 |
|---|---|---|---|
| `MediaItem` | Model | 一条媒体记录 | 纯数据结构 |
| `MediaJsonLoader` | Model | 读取并校验 JSON | 和模型分开：以后换数据源只改这里；坏记录跳过并记录警告 |
| `MediaLibraryModel` | Model | 持有全部数据，以 roles 形式暴露 | 只读；`itemById()` 给 ViewModel 取详情 |
| `MediaFilterModel` | Model | 搜索 + 类型筛选（不排序，保持数据原始顺序） | 由 `LibraryManager` 持有，View 只通过 `items` 属性拿到它 |
| `FromUi` / `ToUi` | 接口层 | 上发 / 下发消息表 | 两个命名空间，各一个按模块分段的 `Message` 枚举；名字就表明方向 |
| `UiEvents` | 接口层 · 上发 | 消息总线：QML 发出的全部消息 | 只有一个 `post(消息, 数据)` 信号；消息名定义在 `FromUi.h`；没有实现代码 |
| `UiDataBase` | 接口层 · 下发 | 数据类的基类 | 统一入口 `publish(名字, 值)`：查表调用 setter，检查类型，打下发日志 |
| `LibraryData` | 接口层 · 下发 | 媒体库页面要显示的全部数据 | 纯数据类，`UI_PROPERTY` 宏定义；QML 只读 |
| `LibraryManager` | 逻辑层 | 媒体库页面的界面逻辑 | 不注册到 QML；见 5.3 |
| `LanguageData` | 接口层 · 下发 | 当前语言、可选语言 | 纯数据类；QML 只读 |
| `LanguageManager` | 逻辑层 | 运行时切换语言 | 不注册到 QML；加载 `.qm` 后调用 `QQmlEngine::retranslate()`，下发 `ToUi::Language`，并发出 `languageChanged` |

### 5.3 `LibraryData`（下发）和 `LibraryManager`（逻辑）

**`LibraryData` 属性（QML 只读，名字都带 `toUi` 前缀，表示发往 UI）**

| 属性 | 类型 | 说明 | 谁下发 |
|---|---|---|---|
| `toUiItems` | `QAbstractItemModel*`（CONSTANT） | 过滤后的列表，ListView 直接绑定 | 构造时设置一次 |
| `toUiSearchText` | `QString` | 搜索框文字，立即更新；**200ms 防抖**后才真正过滤 | `LibraryManager::setSearchText()` |
| `toUiCategory` | `QString` | `""` = 全部；`"Others"` = 四个主要类型以外的 | `LibraryManager::setCategory()` |
| `toUiCategories` | `QVariantList` | 下拉框选项 `[{key, label}]`，`label` 已翻译 | `publishCategories()` |
| `toUiResultCount` / `toUiTotalCount` | `int` | 列表末尾的 “2 of 24 items” | `publishCounts()` |
| `toUiEmptyState` | 枚举 `None / NoData / NoMatch` | View 据此决定显示哪种提示 | `publishCounts()` |
| `toUiSelectedId` | `int` | 当前选中项（记 ID 不记行号），-1 = 未选中 | `select()` |
| `toUiSelectedItem` | `QVariantMap` | 详情 `{title, creator, typeLabel, metaText, description}`，文字已格式化 | `publishSelectedItem()` |

**`LibraryManager` 函数**

| 函数 | 说明 |
|---|---|
| `handleUiEvent(type, data)` | 上发入口：只处理媒体库模块（100~199）的消息，检查数据类型后分发给下面三个函数 |
| `setSearchText(text)` | 处理 `SearchEdited`：下发 `searchText`，重启防抖计时器 |
| `setCategory(key)` | 处理 `TypeSelected`：立即过滤，下发 `category` |
| `select(id)` | 处理 `ItemClicked`：下发 `selectedId` 和 `selectedItem` |
| `publishCounts()` | 过滤结果变化时：下发 `resultCount`、`totalCount`、`emptyState` |
| `retranslate()` | 语言切换后重新下发 `categories` 和 `selectedItem` 里的文字 |

**界面规则（都在 ViewModel 里）**
- 选中项被搜索过滤掉时：**保留选中**，详情继续显示，只是列表里没有高亮行。
- `searchText` 和 `category` 同时为空时，`emptyState` 只可能是 `None` 或 `NoData`。
- 时长、页数、类型名的显示文字统一在 ViewModel 里格式化，View 不拼字符串。

### 5.4 Model roles（ListView 委托里的字段名）

| Role | QML 名称 | 类型 |
|---|---|---|
| `IdRole` | `mediaId` | int（不用 `id`，因为它是 QML 保留字） |
| `TitleRole` | `title` | string |
| `CreatorRole` | `creator` | string |
| `TypeRole` | `type` | string |
| `YearRole` | `year` | int |

列表行只需要这几个字段；完整信息走 `selectedItem`。

## 6. View（QML）

### 6.1 组件树

```mermaid
flowchart TB
    Main["Main.qml"]
    Main --> Wide["WideLayout"]

    Wide --> LP1["LibraryPane"]
    Wide --> DV1["DetailView"]

    LP1 --> Header["HeaderBar · LanguageSwitch"]
    LP1 --> Search["SearchField"]
    LP1 --> TF["TypeFilter 下拉框"]
    LP1 --> List["MediaList · ListView"]
    LP1 --> Empty["EmptyState"]
    List --> Row["MediaRow 委托"]
```

`LibraryPane` 和 `DetailView` 绑定的都是**同一个 `LibraryData` 单例**：左边点了哪一行，右边就显示哪一项。

### 6.2 文件职责

| 文件 | 职责 | 绑定 / 调用 |
|---|---|---|
| `Main.qml` | 窗口；放置 WideLayout | — |
| `Theme.qml` | 单例：颜色、字体、尺寸 | — |
| `layouts/WideLayout.qml` | 左列表、右详情 | — |
| `components/LibraryPane.qml` | 标题栏、搜索、筛选、计数、列表、空状态 | `resultCount`、`totalCount`、`emptyState` |
| `components/SearchField.qml` | 搜索框、清除按钮 | `searchText`；上发 `SearchEdited` |
| `components/TypeFilter.qml` | 带 ▾ 的下拉框，选中后高亮 | `categories`、`category`；上发 `TypeSelected` |
| `components/LanguageSwitch.qml` | `EN \| SV` 分段按钮，当前语言橙色高亮 | `LanguageData.toUiLanguage`；上发 `LanguageSelected` |
| `components/MediaList.qml` / `MediaRow.qml` | 列表和每一行；列表末尾显示计数 | `items`、`selectedId`；上发 `ItemClicked` |
| `components/DetailView.qml` | 详情内容 | `selectedItem` |
| `components/EmptyState.qml` | 无数据 / 无结果提示 | `emptyState` |

### 6.3 状态归属

| 状态 | 放在哪 | 原因 |
|---|---|---|
| 搜索词、类型、选中项、空状态 | `LibraryData`（由 `LibraryManager` 写入） | 业务状态：列表和详情共享 |
| 当前语言 | `LanguageData`（由 `LanguageManager` 写入） | 全局唯一 |
| 下拉框是否展开、动画 | View 自己 | **纯视觉状态**，和业务无关，留在 QML 合理 |

## 7. 关键流程

### 7.1 搜索（含防抖）

```mermaid
sequenceDiagram
    actor U as 用户
    participant SF as SearchField · View
    participant UE as UiEvents
    participant VM as LibraryManager
    participant F as MediaFilterModel
    participant LD as LibraryData
    participant L as ListView · View
    participant E as EmptyState · View

    U->>SF: 输入 a、u、r
    SF->>UE: post(SearchEdited, "aur")（每次按键）
    UE->>VM: handleUiEvent → setSearchText("aur")
    VM->>LD: setSearchText("aur")（搜索框文字立即下发）
    VM->>VM: 重启 200ms 防抖计时器
    Note over VM: 停止输入 200ms 后
    VM->>F: setSearchText("aur")
    F->>F: 逐行 filterAcceptsRow()
    F-->>L: rowsRemoved / rowsInserted（列表自己更新）
    F-->>VM: rowsRemoved → publishCounts()
    VM->>LD: publish(ResultCount, 2)、publish(EmptyState, None)
    LD-->>E: resultCountChanged / emptyStateChanged
```

### 7.2 选中与详情

```mermaid
sequenceDiagram
    actor U as 用户
    participant R as MediaRow · View
    participant UE as UiEvents
    participant VM as LibraryManager
    participant LM as MediaLibraryModel
    participant LD as LibraryData
    participant D as DetailView · View

    U->>R: 点击
    R->>UE: post(ItemClicked, mediaId)
    UE->>VM: handleUiEvent → select(mediaId)
    VM->>LM: itemById(mediaId)
    VM->>VM: publishSelectedItem()：格式化 metaText 等字段
    VM->>LD: publish(SelectedId, id)、publish(SelectedItem, 详情)
    LD-->>D: selectedItemChanged → 右侧刷新
```

### 7.3 语言切换

```mermaid
sequenceDiagram
    actor U as 用户
    participant SW as LanguageSwitch · View
    participant UE as UiEvents
    participant LM as LanguageManager
    participant QE as QQmlEngine
    participant VM as LibraryManager
    participant UI as 全部 View 文本

    U->>SW: 点击 “SV”
    SW->>UE: post(LanguageSelected, "sv")
    UE->>LM: handleUiEvent → setLanguage("sv")
    LM->>LM: 卸载旧翻译，安装 :/i18n/medialibrary_sv.qm（英文是源语言，只卸载）
    LM->>QE: retranslate()
    QE-->>UI: 所有 qsTr() 重新求值
    LM-->>VM: languageChanged（main.cpp 中连接）
    VM->>VM: retranslate()：重新生成 categories、selectedItem 的文字
    VM-->>UI: 经 LibraryData 下发 categoriesChanged / selectedItemChanged
    UI->>UI: TypeFilter 按 category 重新选回原来那一项
```

**翻译范围**：界面文字（View 里的 `qsTr()`）和 ViewModel 生成的显示文字（C++ 里的 `tr()`）都会翻译；标题、创作者、简介属于媒体数据，保持原文。

**支持的语言**

| 代码 | 按钮 | 翻译文件 |
|---|---|---|
| `en` | EN | 无（源语言，代码里写的就是英文） |
| `sv` | SV | `i18n/medialibrary_sv.ts` |

加一种语言：在 `LanguageManager` 构造函数的 `AvailableLanguages` 里加一项，在 `CMakeLists.txt` 的 `qt_add_translations` 里加一个 `.ts`，运行 `update_translations` 生成待翻译条目后填写译文。

**一个细节**：切换语言时 C++ 会重新下发下拉框选项（label 换成新语言），`ComboBox` 换了 model 后会自动回到第 0 项，而当前筛选并没有变。所以 `TypeFilter` 监听 `categoriesChanged`，按 `category` 重新选回原来那一项。

## 8. 布局

只做横屏：左列表（约 42%）+ 右详情，适用于车机横屏 1920×720、桌面。窗口最小宽度 900，再窄两栏就挤不下了。

- 字号和间距统一写成 `Theme.sp(16)`、`Theme.dp(12)`，目前就是固定像素，不随窗口缩放。
- 以后要做分辨率适配，只需在 `Theme.qml` 的这两个函数里乘一个缩放系数，组件代码不用改。

## 10. 构建结构

```mermaid
flowchart LR
    subgraph lib["mediacore 静态库"]
        I["interface/"]
        L["logic/"]
        M["model/"]
    end
    subgraph app["appMediaLibrary 可执行文件"]
        QM["QML 模块 MediaLibrary<br/>qml/ + data/ + i18n/*.qm"]
        MainCpp["main.cpp"]
    end
    app --> lib
```

- Model、ViewModel、Service 编成静态库 `mediacore`，主程序链接它。逻辑和界面分开编译，以后补单元测试时可以直接链接这个库，不用启动界面。
- `qt_add_qml_module` 把 QML、数据和翻译文件打包进程序。
- `qt_add_translations` 编译时自动运行 `lrelease`，生成 `.qm` 并打包到资源 `:/i18n/` 下；`SOURCE_TARGETS` 让它同时扫描 QML 和 `mediacore` 里 C++ 的 `tr()`。
- Windows 下编译完成后用 `windeployqt` 复制运行库。

## 11. 设计取舍（README 中也会写）

| 决策 | 理由 |
|---|---|
| MVVM，ViewModel 用 C++ 写 | QML 绑定天然适合 MVVM；逻辑和界面分离 |
| `main.cpp` 组装对象，注册成 QML 单例 | 只有一个页面级 ViewModel，单例最简单，不用逐层传属性 |
| 上发统一走 `UiEvents.post`，下发统一走数据类 | 参考车机 HMI：上下行接口各自集中，逻辑类对 QML 不可见 |
| 搜索防抖放在 ViewModel 里 | 是界面逻辑而不是界面样式 |
| 显示文字在 ViewModel 里格式化 | View 不拼字符串；各语言的格式由同一处负责 |
| 用 `QSortFilterProxyModel` 过滤 | 源数据不变，只刷新变化的行，性能好 |
| 选中项记 ID 不记行号 | 搜索、筛选后行号会变 |
| 不做持久化和收藏 | 控制范围，专注题目要求 + 工程质量 |
